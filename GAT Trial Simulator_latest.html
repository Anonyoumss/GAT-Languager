<style>
:root{--bg:#F6F5F1;--surface:#FBFAF6;--surface2:#EEEBE2;--text:#1B1B18;--muted:#6B6A62;--border:#DEDACD;--primary:#1C2B4A;--pink:#F6F5F1;--accent:#B8823F;--danger:#B8433A;--ok:#2E7D57;}
.mx{font-family:'IBM Plex Mono',monospace;font-size:15px;display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}
.frac .num,.frac .den{padding:0 3px}
.frac .num{border-bottom:1.4px solid currentColor}
.root{display:inline-flex;align-items:flex-start;vertical-align:middle;margin:0 2px}
.root .rootidx{font-size:10px;margin-right:-2px;margin-top:-2px}
.root .radsym{font-size:16px}
.root .radicand{border-top:1.4px solid currentColor;padding:0 3px 0 1px;margin-top:1px}
.mx sup{font-size:11px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14151A;--surface:#1D1F27;--surface2:#262834;--text:#ECEAE1;--muted:#9A988D;--border:#353849;--primary:#5F82C4;--pink:#0E1220;--accent:#D6A268;--danger:#E08277;--ok:#4CAE7F;}}
:root[data-theme="dark"]{--bg:#14151A;--surface:#1D1F27;--surface2:#262834;--text:#ECEAE1;--muted:#9A988D;--border:#353849;--primary:#5F82C4;--pink:#0E1220;--accent:#D6A268;--danger:#E08277;--ok:#4CAE7F;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'IBM Plex Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh;display:flex;flex-direction:column}
body[dir="rtl"]{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif}
::selection{background:var(--accent);color:#1B1B18}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);direction:ltr}
.top-in{max-width:980px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.brand small{font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font:600 15px 'IBM Plex Mono',monospace;min-width:48px;text-align:right}
.clock.low{color:var(--danger)}
.xbtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.tbar{height:2px;background:var(--border)}
.tbar i{display:block;height:100%;width:0;background:var(--primary)}
.tbar i.low{background:var(--danger)}
.wrap{width:100%;max-width:980px;margin:0 auto;padding:22px 18px 40px;flex:1}
h1{font-size:26px;line-height:1.2;margin:6px 0 8px;font-weight:600}
h2{font-size:16px;margin:0 0 4px;font-weight:600}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
body[dir="rtl"] .label{letter-spacing:0;text-transform:none;font-size:12px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:16px}
.rows .row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.rows .row:last-child{border-bottom:0}
.rt{font-weight:600}
.btn{background:var(--primary);color:var(--pink);border:1px solid var(--primary);border-radius:4px;padding:9px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn.line{background:none;color:var(--text);border-color:var(--border)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);background:var(--bg);border-radius:4px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--surface2)}
.key{flex:0 0 26px;height:26px;border:1px solid var(--border);border-radius:3px;display:grid;place-items:center;font:600 12px 'IBM Plex Sans Arabic','IBM Plex Mono',monospace}
.opt.sel .key{background:var(--primary);color:var(--pink);border-color:var(--primary)}
.ot{padding-top:2px}
.qt{font-size:16px;line-height:1.7;white-space:pre-wrap}
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.pane{padding:20px;min-width:0}
.passage{border-inline-end:1px solid var(--border);max-height:68vh;overflow-y:auto;background:var(--bg)}
.ptext{white-space:pre-wrap;line-height:1.8;font-size:15px}

.qbar{height:2px;background:var(--border);margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--accent)}

.ltr-num,mjx-container{direction:ltr!important;unicode-bidi:isolate;display:inline-block}
u{text-decoration-thickness:2px;text-underline-offset:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}

.brow{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;margin:9px 0;font-size:13px}
.btrack{height:8px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bfill{display:block;height:100%;background:var(--primary)}
.bfill.b{background:var(--accent)}
.bv{text-align:end;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px}

.score{font-size:56px;line-height:1;font-weight:600;font-family:'IBM Plex Mono',monospace}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0 16px;direction:ltr}
.rcell{aspect-ratio:1;border:1px solid var(--border);border-radius:3px;display:grid;place-items:center;font:600 13px 'IBM Plex Mono',monospace;cursor:pointer;background:var(--bg)}

.rcell.un{border-style:dashed;color:var(--muted)}
.rcell.fl{outline:2px solid var(--accent);outline-offset:1px}
.dirs{margin:12px 0 0;padding-inline-start:20px}
.dirs li{margin:6px 0}
.note{border:1px solid var(--accent);border-radius:4px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.sk{background:var(--surface2);border-radius:3px;animation:pulse 1.2s ease-in-out infinite}

.foot{border-top:1px solid var(--border);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);direction:ltr}

.modal{position:fixed;inset:0;background:rgba(20,21,26,.55);display:grid;place-items:center;padding:18px;z-index:50}
.modal .panel{max-width:460px;margin:0}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style>

// Underline markup: __word__ -> <u>word</u>
function mdUnderline(s){ return s.replace(/__(.+?)__/g, '<u>$1</u>'); }
// Wrap raw numbers/math tokens (outside \(...\) blocks) so they stay LTR inside RTL text
function wrapNumbersLTR(s){
  // Walk the string and skip over any <span class='mx'...>...</span> (balancing
  // nested <span> tags properly) or <sup>...</sup> block untouched, since that
  // content is already-built math HTML (including entities like &#8730;) that
  // must never be touched by the plain-prose digit-wrapper below.
  let out = '', i = 0; const n = s.length;
  const numRe = /([0-9٠-٩][0-9٠-٩.,%٪:\/\-\+×÷=<>٫ ]*[0-9٠-٩%٪])/g;
  while(i < n){
    if(s.startsWith("<span class='mx'", i) || s.startsWith('<span class="mx"', i)){
      let depth = 1, j = s.indexOf('>', i) + 1;
      while(depth > 0 && j < n){
        const nextOpen = s.indexOf('<span', j);
        const nextClose = s.indexOf('</span>', j);
        if(nextClose === -1){ j = n; break; }
        if(nextOpen !== -1 && nextOpen < nextClose){ depth++; j = s.indexOf('>', nextOpen) + 1; }
        else { depth--; j = nextClose + 7; }
      }
      out += s.slice(i, j); i = j;
    } else if(s.startsWith('<sup>', i)){
      const close = s.indexOf('</sup>', i);
      const end = close === -1 ? n : close + 6;
      out += s.slice(i, end); i = end;
    } else {
      const c1 = s.indexOf("<span class='mx'", i), c2 = s.indexOf('<span class="mx"', i), c3 = s.indexOf('<sup>', i);
      const cands = [c1,c2,c3].filter(x=>x!==-1);
      const next = cands.length ? Math.min(...cands) : n;
      out += s.slice(i, next).replace(numRe, '<span class="ltr-num">$1</span>');
      i = next;
    }
  }
  return out;
}

  passages:{
    pharmacy: `(1) عُرف علم الصيدلة عند العلماء في القرون الوسطى بأسماء كثيرة، منها علم الأدوية، وعلم المفردات، وعلم العقاقير، وعلم الأقرابازينيّات. لكن العلماء المسلمين العرب هم الذين أطلقوا على هذا العلم اسم علم الصيدلة، والقائم به يعرف بالصيدلاني أو الصيدلي. ولدينا كتب متعددة عنه نستطيع أن نقول: إن علم الصيدلة تقدّم على أيدي العرب تقدماً كبيراً.\n\n(2) والصيدلة متصلة بعلم الأعشاب (النبات) وبعلوم الحيوان والمعادن والكيمياء؛ لأن الأدوية نباتية وحيوانية ومعدنية تحتاج إلى معالجة وإلى نسب في التركيب تقتضي المعرفة بالكيمياء. والفرق بين علم الصيدلة وعلم النبات أن الصيدلة يبحث في التأثير الطبي للنبات، أما علم النبات فعلم يبحث في خواص النبات.\n\n(3) وكان الطبيب يعمل في الصيدلة، وله بالطبع أعوان يجمعون له النبات الشافي والأعشاب الطبيعية، إلا أن هناك شيئًا ثابتًا لا بد من ذكره وهو أن الأدوية قديمًا كانت تنتقل مباشرة من يد الطبيب إلى يد العليل دون أي وسيط، فكان الطبيب يفحص المريض ويصف له العلاج الناجع، ويحضّره ثم يقدّمه إليه بنفسه ليتناوله.\n\n(4) ومن الصعب جداً فصل علم الصيدلة عن علم الطب، لذلك كان الطبيب في القرون الوسطى يعمل طبيباً ويعمل نفس الوقت صيدلانيًا، وبقي الأمر مستمرًا حتى قرر أطباء العالم العربي والإسلامي أن يميزوا بين الأمور أكثر تعقيدًا؛ حيث إن الأمور صارت أكثر تعقيدًا ويلزم أن يعمل في حقل الصيدلة ويترك التطبيق الطبي للأطباء.\n\n(5) إن العقاقير قد كثرت وتشعبت طرق تركيبها وطالت، فاستوجبت من يخصص لها وقته ويكرس لها جهده، ويفتش عن الأعشاب الطبيعية في كل مكان، وهنا انقسمت مسؤولية الطبيب الصيدلي والصيدلي الطبيب إلى قسمين، وتفرّعت منها مهنتان قائمتان بذاتيهما.\n\n(6) لقد اهتم العلماء المسلمون بتحضير الأدوية المفردة والمركبة، سواء أكانت من نبات أم من حيوان أم من معادن، وقد عرّفوا الأدوية المفردة بالعقاقير الأصليّة، أما الأدوية المركّبة فسموها الأقرابازين الأقاربينين، وبقي هذان الاسمان متداولين عبر التاريخ. وقدّموا تقدمًا ملحوظًا في معرفة خواص العقاقير ومصادرها؛ فهم العرب الذين أسّسوا لهذه الصيدلة الحقيقيين وهم الذين رفعوها عن مستوى تجارة العقاقير، وأنشؤوا المدارس لتحضيرها وتصريفها، وأخّضعوا هذه الصناعة لرقابة الدولة لمنع الغش، فكان الصيادلة لا يزاولون مهنتهم إلا بعد الترخيص لهم.\n\n(7) إضافة إلى ما سبق، فالعرب هم المؤسسون الحقيقيون لمهنة الصيدلة وهم الذين رفعوها عن مستوى تجارة العقاقير، وأنشؤوا المدارس لتحضير الأدوية وتصريفها، وأخضعوا هذه الصناعة لرقابة الدولة لمنع الغش، فكان الصيادلة لا يزاولون مهنتهم إلا بعد الترخيص لهم. وقد افتتحوا الصيدليات العامة في أواخر القرن الثامن للميلاد في عهد المنصور. كما ألحقوا بكل بيمارستان صيدلية خاصة به. ومنذ أيام المأمون في القرن التاسع كانت الصيدليات تحت إشراف الدولة صيانة لها من تجار العقاقير.`,
    globalization: `(1) الاحتكاك الحضاري يستتبع احتكاكاً لغوياً في الغالب بين اللغة الأصلية واللغة الوافدة. فهل تواجه اللغة العربية تحدياً في عصر العولمة؟\n\n(2) عندما كان العرب يعيشون منعزلين نسبياً في جزيرتهم العربية، لم تكن لغتهم تتعرض للاحتكاك بالدرجة التي تؤثر فيها تأثيراً عميقاً؛ لذلك اقتصرت التأثيرات الأجنبية فيها على بعض الألفاظ التي أفادها التجار وبعض الشعراء من البلدان المجاورة، والمتعلقة غالباً بأسماء الأدوات أو النباتات التي لم يكن للعرب عهد بها في جزيرتهم. وبعد أن انتشر العرب في الأمصار الإسلامية أخذت التحديات تواجه اللغة العربية بفعل الاحتكاك باللغات الأخرى، وعلى الرغم من أن الغلبة كانت للغة العربية، وتحول أبناء الأمصار إلى الثقافة الإسلامية واللغة العربية، كما حدث في مصر وفارس، فقد تأثرت باللغات الأخرى بدرجة محدودة، وكان العلماء آنذاك يبادرون إلى جمع تلك الألفاظ ويضعون لها القواعد.\n\n(3) أما في العصر الحاضر فتواجه اللغة العربية، كغيرها من اللغات الشرقية، تحديات من قبل قوى العولمة المتمثلة في المصالح المادية الناجمة عن الاتصال بالأجنبي، والتأثير الإعلامي القائم على تفضيل اللغة الإنجليزية على أنها اللغة العالمية التي هي لغة النشر. إن التحدي الذي يواجه اللغة العربية في هذا العصر مرده الشعور بأهمية اللغة الأجنبية غالباً عند من هو مولع بكل ما هو أجنبي. والغريب أن الولع باللفظ الأجنبي يؤدي بكثير من الناس إلى ترك اللفظ العربي الميسر إلى الغريب مثل كلمة 'جوال'، التي استقرت لدى كثير من العرب، ومع ذلك فإن بعض الناس ما زالوا يستعملون كلمة 'موبايل'.\n\n(4) وقد بادر بعض أبناء العربية بتشجيع الاستعمال الرسمي للفظ العربي وإكسابه السيرورة، كما هي تجربة المجمع اللغوي في دمشق الذي قام بدراسة الألفاظ الأجنبية الشائعة بهدف وضع ألفاظ عربية مكانها. ويمكن القول إن الحفاظ على اللغة العربية يستلزم إتقان لغة أجنبية مع المحافظة على العربية، وتوظيفها بصورة جيدة في مختلف المجالات.\n\n(5) إن أجواء العولمة المتفتحة والمتطورة يمكن أن تعين على إيجاد وسائل تستخدم في صالح اللغة العربية كي تأخذ مكانتها في حياة الإنسان العربي. فتقدُّم وسائل الاتصال يخدمها من حيث نشرها، وسهولة التواصل بين الباحثين في قضاياها، وإنتاج البرامج التعليمية والتثقيفية الجذابة الميسرة، وبعث كنوزها المخبوءة، ويؤكد ذلك أن هناك دراسة أجريت في اليابان، مفادها أن اللغة العربية تصدرت لغات العالم من حيث وضوح الصوت في استخدام الحاسب الآلي.`,

const app = document.getElementById('app'), headerTitle = document.getElementById('headerTitle'), timerDisp = document.getElementById('timerDisp'), timeBar = document.getElementById('timeBar'), exitBtn = document.getElementById('exitBtn');

function loadHistory(){ try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];} }
function saveHistory(r){ const h=loadHistory(); h.push(r); try{localStorage.setItem(KEY,JSON.stringify(h));}catch(e){} }
function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }
function typeset(){ if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise(); } }
function isRTLTest(){ return !!state.test && state.test.lang==='ar'; }
function fmt(s,rtl){ let o=mdUnderline(s); return rtl?wrapNumbersLTR(o):o; }
function letter(i,rtl){ return rtl?['أ','ب','ج','د','هـ'][i]:String.fromCharCode(65+i); }
function currentQ(){ return state.test.sections[state.sIdx].qs[state.qIdx]; }
function qKey(s,q){ return state.test.id+'_'+(s!==undefined?s:state.sIdx)+'_'+(q!==undefined?q:state.qIdx); }
function ns(n){ return `<span class="ltr-num">${n}</span>`; }

function render(){
  const rtl = ['intro','test','sectionReview'].includes(state.screen) && isRTLTest();
  document.body.dir = rtl?'rtl':'ltr';
  document.documentElement.lang = rtl?'ar':'en';
  const inTest = ['intro','test','sectionReview'].includes(state.screen);
  exitBtn.style.display = inTest?'':'none';
  headerTitle.textContent = inTest ? state.test.sections[state.sIdx].name : '';
  if(state.screen!=='test' && state.screen!=='sectionReview'){ timerDisp.textContent=''; timeBar.style.width='0%'; }
  ({home:renderHome,loading:renderLoading,intro:renderIntro,test:renderTest,sectionReview:renderSectionReview,results:renderResults})[state.screen]();
  if(state.screen==='test'||state.screen==='sectionReview') updateClock();
  if(state.animate){ state.animate=false; animateIn(); }
  typeset();
}
function animateIn(){
  if(!window.anime || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  anime({targets:'#app > *', opacity:[0,1], translateY:[6,0], duration:280, easing:'easeOutQuad', delay:anime.stagger(40)});
  document.querySelectorAll('.bfill').forEach(el=>anime({targets:el, width:['0%',el.dataset.w+'%'], duration:700, easing:'easeOutCubic', delay:180}));
}

function renderHome(){
  const hist=loadHistory(), last=id=>hist.filter(h=>h.testId===id).slice(-1)[0], e=last('E'), a=last('A');

      <p style="margin:14px 0 4px"><b>${verdict}</b></p>

    <p class="muted" style="max-width:620px;margin:0 0 20px">Both official ETEC trial forms with real 25 minute sections, section directions, flagging, a review screen before each submit, and per question timing. Run each form once and the comparison appears below.</p>
    <div class="panel"><div class="label">Choose a form</div><div class="rows">
      <div class="row"><div><div class="rt">English form</div><div class="muted">96 questions, 4 sections, 100 minutes</div></div><button class="btn" onclick="startTest('E')">Start</button></div>
      <div class="row"><div><div class="rt">Arabic scientific form</div><div class="muted">96 questions, 4 sections, 100 minutes</div></div><button class="btn" onclick="startTest('A')">Start</button></div>
    </div></div>
    ${cmp}
    ${hist.length?`<div class="panel"><div class="label">Past runs</div><table><tr><th>Form</th><th>Score</th><th>Time</th><th>Avg/Q</th><th>Flags</th></tr>${hist.slice().reverse().map(h=>`<tr><td>${h.testId==='E'?'English':'Arabic'}</td><td>${h.correct}/${h.total}</td><td>${Math.floor(h.totalSec/60)}m ${Math.round(h.totalSec%60)}s</td><td>${h.avgSec.toFixed(1)}s</td><td>${h.flaggedCount}</td></tr>`).join('')}</table>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn line" onclick="clearHist()">Clear history</button><button class="btn" onclick="exportData()">Export data (JSON)</button></div></div>`:''}`;
}
function clearHist(){ if(confirm('Clear all saved runs?')){ localStorage.removeItem(KEY); state.animate=false; render(); } }
function exportData(){
  const blob=new Blob([JSON.stringify(loadHistory(),null,2)],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='gat_simulator_data.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}

// ---------- Flow ----------
function startTest(id){
  state.test = id==='E'?TEST_E:TEST_A; state.sIdx=0; state.qIdx=0; state.answers={}; state.flags={}; state.timings={}; state.notice='';
  withSkeleton(()=>{ state.screen='intro'; state.animate=true; render(); },320);
}
function renderIntro(){
  const t=state.test, sec=t.sections[state.sIdx], rtl=isRTLTest(), counts={};
  sec.qs.forEach(q=>counts[q.domain]=(counts[q.domain]||0)+1);
  const dirs = rtl
    ? ['هناك إجابة صحيحة واحدة عن كل سؤال.','بعد الانتقال إلى قسم لاحق لا يمكن العودة إلى قسم سابق.','يمكنك تعليم الأسئلة ومراجعة إجاباتك قبل تسليم القسم.','يبدأ عدّاد الوقت عند الضغط على زر البدء.']
    : ['There is only ONE correct answer to each question.','Once you proceed to a later section, you cannot return to an earlier one.','You can flag questions and review your answers before submitting the section.','The section timer starts when you press Begin.'];
  const rows = Object.keys(counts).map(k=>`<tr><td>${DOMAIN_INFO[k][t.lang].name}</td><td>${ns(counts[k])}</td></tr>`).join('');
  app.innerHTML = `${state.notice?`<div class="note">${escapeHtml(state.notice)}</div>`:''}
    <div class="panel"><div class="label">${rtl?'التعليمات':'Directions'}</div>
      <h1>${escapeHtml(sec.name)}</h1>
      <p class="muted" style="margin:0">${rtl?'الأسئلة':'Questions'} ${ns(sec.qs[0].n+' - '+sec.qs[sec.qs.length-1].n)} &nbsp;|&nbsp; ${rtl?'الزمن':'Time'} ${ns(sec.time/60)} ${rtl?'دقيقة':'min'}</p>
      <ul class="dirs">${dirs.map(d=>`<li>${d}</li>`).join('')}</ul></div>
    <div class="panel"><div class="label">${rtl?'أنواع الأسئلة في هذا القسم':'Question types in this section'}</div><table>${rows}</table></div>
    <button class="btn" onclick="beginSection()">${rtl?'ابدأ القسم':'Begin section'}</button>`;
}
function beginSection(){
  const sec=state.test.sections[state.sIdx];
  state.deadline=Date.now()+sec.time*1000; state.remaining=sec.time; state.qIdx=0; state.qStart=Date.now(); state.notice='';
  startTicker(); state.screen='test'; state.animate=true; render();
}
function startTicker(){
  stopTicker();
  state.ticker=setInterval(()=>{ state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000)); updateClock(); if(state.remaining<=0) submitSection(true); },500);
}
function stopTicker(){ clearInterval(state.ticker); state.ticker=null; }
function updateClock(){
  const s=state.remaining, sec=state.test.sections[state.sIdx], low=s<60;
  timerDisp.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  timeBar.style.width=(100*s/sec.time)+'%';
  timerDisp.classList.toggle('low',low); timeBar.classList.toggle('low',low);
}
function recordTiming(){ const k=qKey(); state.timings[k]=(state.timings[k]||0)+(Date.now()-state.qStart)/1000; state.qStart=Date.now(); }
function confirmExit(){ if(confirm('End this test and return home? Progress on this run will not be saved.')){ stopTicker(); state.screen='home'; state.animate=true; render(); } }

// ---------- Question screen ----------
function renderChart(id,rtl){
  const c=state.test.charts&&state.test.charts[id]; if(!c) return '';
  if(c.type==='pie'){
    const tot=c.data.reduce((a,b)=>a+b.val,0), cols=['#1C2B4A','#B8823F','#5B6B8C','#8C7A5B','#9AA3B5']; let acc=0, p='';
    c.data.forEach((d,i)=>{const s=acc/tot*2*Math.PI; acc+=d.val; const e=acc/tot*2*Math.PI; p+=`<path d="M50,50 L${50+40*Math.sin(s)},${50-40*Math.cos(s)} A40,40 0 ${e-s>Math.PI?1:0} 1 ${50+40*Math.sin(e)},${50-40*Math.cos(e)} Z" fill="${cols[i]}" stroke="var(--surface)" stroke-width="1"/>`;});
    return `<div dir="ltr" style="margin-top:12px"><b style="font-size:13px">${escapeHtml(c.title)}</b><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px"><svg width="120" height="120" viewBox="0 0 100 100">${p}</svg><div>${c.data.map((d,i)=>`<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0"><i style="width:10px;height:10px;background:${cols[i]};display:inline-block"></i>${escapeHtml(d.label)} ${d.val}%</div>`).join('')}</div></div></div>`;
  }
  return `<div style="margin-top:12px"><b style="font-size:13px">${escapeHtml(c.title)}</b><table style="margin-top:6px"><tr><th>المنشأة</th><th>عدد الأجزاء</th></tr>${c.rows.map(r=>`<tr><td>${escapeHtml(r.label)}</td><td>${ns(escapeHtml(r.val))}</td></tr>`).join('')}</table></div>`;
}
function renderTest(){
  const t=state.test, sec=t.sections[state.sIdx], q=currentQ(), rtl=isRTLTest(), total=sec.qs.length, key=qKey(), info=DOMAIN_INFO[q.domain][t.lang], fl=!!state.flags[key];
  const dom=`<div class="dom"><span class="tl">${rtl?'نوع السؤال':'Question type'}</span><b>${escapeHtml(info.name)}</b>${escapeHtml(info.desc)}</div>`;
  const opts=q.opts.map((o,i)=>`<div class="opt ${state.answers[key]===i?'sel':''}" role="button" tabindex="0" onclick="selectOpt(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){selectOpt(${i});event.preventDefault()}"><span class="key">${letter(i,rtl)}</span><span class="ot">${fmt(o,rtl)}</span></div>`).join('');
  const qh=`<div class="qt">${fmt(q.text,rtl)}</div>${q.chartId?renderChart(q.chartId,rtl):''}<div class="opts">${opts}</div>`;
  const body=q.passageId
    ? `<div class="split"><div class="pane passage"><div class="label">${rtl?'النص':'Passage'}</div><div class="ptext">${fmt(t.passages[q.passageId],rtl)}</div></div><div class="pane">${dom}${qh}</div></div>`
    : `<div class="panel">${dom}${qh}</div>`;
  app.innerHTML=`<div class="qmeta"><span>${rtl?'السؤال':'Question'} ${ns(state.qIdx+1+' / '+total)}</span><span>${rtl?'القسم':'Section'} ${ns((state.sIdx+1)+' / '+t.sections.length)}</span></div>
    <div class="qbar"><i style="width:${100*(state.qIdx+1)/total}%"></i></div>${body}
    <div class="nav"><button class="btn line" onclick="prevQ()" ${state.qIdx===0?'disabled':''}>${rtl?'السابق':'Back'}</button>
    <button class="flagbtn ${fl?'on':''}" id="flagBtn" onclick="toggleFlag()">${ICON_FLAG}<span>${fl?(rtl?'معلّم':'Flagged'):(rtl?'علّم للمراجعة':'Flag for review')}</span></button>
    <button class="btn" onclick="nextQ()">${state.qIdx===total-1?(rtl?'مراجعة القسم':'Review section'):(rtl?'التالي':'Next')}</button></div>`;
}
function selectOpt(i){ recordTiming(); state.answers[qKey()]=i; document.querySelectorAll('.opt').forEach((el,x)=>el.classList.toggle('sel',x===i)); }
function toggleFlag(){
  const k=qKey(), rtl=isRTLTest(); state.flags[k]=!state.flags[k];
  const b=document.getElementById('flagBtn'); b.classList.toggle('on',state.flags[k]);
  b.querySelector('span').textContent=state.flags[k]?(rtl?'معلّم':'Flagged'):(rtl?'علّم للمراجعة':'Flag for review');
}
function goQ(n){ recordTiming(); state.qIdx=n; state.animate=true; render(); }
function nextQ(){ const sec=state.test.sections[state.sIdx]; if(state.qIdx<sec.qs.length-1) goQ(state.qIdx+1); else { recordTiming(); state.screen='sectionReview'; state.animate=true; render(); } }
function prevQ(){ if(state.qIdx>0) goQ(state.qIdx-1); }
document.addEventListener('keydown',e=>{
  if(state.screen!=='test'||e.ctrlKey||e.metaKey) return;
  const n='1234'.indexOf(e.key); if(n>=0&&n<currentQ().opts.length) selectOpt(n);
  else if(e.key==='f'||e.key==='F') toggleFlag();
});

// ---------- Section review ----------
function renderSectionReview(){
  const t=state.test, sec=t.sections[state.sIdx], rtl=isRTLTest(), last=state.sIdx===t.sections.length-1;
  const un=sec.qs.filter((q,i)=>state.answers[qKey(state.sIdx,i)]===undefined).length, fl=sec.qs.filter((q,i)=>state.flags[qKey(state.sIdx,i)]).length;
  const cells=sec.qs.map((q,i)=>{const k=qKey(state.sIdx,i);return `<div class="rcell ${state.answers[k]!==undefined?'ans':'un'} ${state.flags[k]?'fl':''}" role="button" tabindex="0" onclick="jumpTo(${i})" onkeydown="if(event.key==='Enter')jumpTo(${i})">${q.n}</div>`;}).join('');
  app.innerHTML=`<div class="panel"><div class="label">${rtl?'مراجعة القسم':'Section review'}</div><h1>${rtl?'راجع إجاباتك':'Review your answers'}</h1>
    <p class="muted" style="margin:0">${ns(un)} ${rtl?'دون إجابة':'unanswered'} &nbsp;|&nbsp; ${ns(fl)} ${rtl?'معلّم':'flagged'}. ${rtl?'الوقت ما زال يعمل. اضغط على رقم للعودة إليه.':'The timer is still running. Select a number to go back to it.'}</p>
    <div class="rgrid">${cells}</div>
    <p class="muted" style="font-size:12px;margin:0 0 16px">${rtl?'ممتلئ: مُجاب. متقطع: دون إجابة. إطار برتقالي: معلّم.':'Filled: answered. Dashed: unanswered. Outlined in bronze: flagged.'}</p>
    <div class="nav"><button class="btn line" onclick="jumpTo(${sec.qs.length-1})">${rtl?'العودة للاختبار':'Back to test'}</button>
    <button class="btn" onclick="submitSection(false)">${last?(rtl?'تسليم القسم الأخير':'Submit final section'):(rtl?'تسليم والمتابعة':'Submit and continue')}</button></div></div>`;
}
function jumpTo(i){ state.qIdx=i; state.qStart=Date.now(); state.screen='test'; state.animate=true; render(); }
function submitSection(auto){
  if(state.screen==='test') recordTiming();
  stopTicker();
  const rtl=isRTLTest();
  state.notice = auto ? (rtl?'انتهى وقت القسم السابق وتم تسليمه تلقائيًا.':'The previous section was submitted automatically when time ran out.') : '';
  if(state.sIdx<state.test.sections.length-1){ state.sIdx++; state.qIdx=0; state.screen='intro'; state.animate=true; render(); }
  else finishTest();
}

// ---------- Results ----------
function finishTest(){
  const t=state.test; let correct=0,total=0,totalSec=0,flaggedCount=0,unanswered=0; const secStats=[],domainStats={},rows=[];
  t.sections.forEach((sec,si)=>{ let sc=0;
    sec.qs.forEach((q,qi)=>{ const k=qKey(si,qi), g=state.answers[k], d=state.timings[k]||0, f=!!state.flags[k], ok=g===q.ans;
      total++; totalSec+=d; if(f) flaggedCount++; if(g===undefined) unanswered++; if(ok){correct++;sc++;}
      const ds=domainStats[q.domain]||(domainStats[q.domain]={correct:0,total:0,sec:0}); ds.total++; ds.sec+=d; if(ok) ds.correct++;
      rows.push({n:q.n,section:sec.name,domain:q.domain,given:g===undefined?null:g,correctIdx:q.ans,ok,sec:+d.toFixed(1),flagged:f,question:q.text.slice(0,140),chosen:g===undefined?null:q.opts[g],correctText:q.opts[q.ans]});
    });
    secStats.push({name:sec.name,total:sec.qs.length,correct:sc});
  });
  const rec={testId:t.id,label:t.label,when:Date.now(),correct,total,unanswered,totalSec,avgSec:totalSec/total,flaggedCount,sections:secStats,domainStats,rows};
  saveHistory(rec); state.result=rec;
  withSkeleton(()=>{ state.screen='results'; state.animate=true; render(); },420);
}
function renderResults(){
  const r=state.result, t=state.test, rtl=t.lang==='ar', pct=Math.round(100*r.correct/r.total);
  const secBars=r.sections.map(s=>bar(escapeHtml(s.name),100*s.correct/s.total,`${s.correct}/${s.total}`)).join('');
  const domBars=Object.keys(r.domainStats).map(k=>{const d=r.domainStats[k];return bar(DOMAIN_INFO[k].en.name,100*d.correct/d.total,`${d.correct}/${d.total} · ${(d.sec/d.total).toFixed(0)}s`,'b');}).join('');
  const miss=r.rows.filter(x=>!x.ok).map(x=>`<tr><td>${x.n}</td><td>${DOMAIN_INFO[x.domain].en.name}${x.flagged?' (flagged)':''}</td><td dir="${rtl?'rtl':'ltr'}">${x.chosen===null?'-':fmt(x.chosen,rtl)}</td><td dir="${rtl?'rtl':'ltr'}">${fmt(x.correctText,rtl)}</td><td>${x.sec}s</td></tr>`).join('');
  app.innerHTML=`<div class="panel"><div class="label">${escapeHtml(r.label)}</div><div class="score">${r.correct}<span class="muted" style="font-size:24px"> / ${r.total}</span></div>
    <p class="muted" style="margin:8px 0 0">${pct}% correct, ${Math.floor(r.totalSec/60)}m ${Math.round(r.totalSec%60)}s of answering time, ${r.avgSec.toFixed(1)}s per question, ${r.flaggedCount} flagged, ${r.unanswered} unanswered.</p></div>
    <div class="panel"><div class="label">By section</div>${secBars}</div>
    <div class="panel"><div class="label">By domain (correct, average seconds)</div>${domBars}</div>
    ${miss?`<div class="panel"><div class="label">Missed or unanswered</div><table><tr><th>Q</th><th>Domain</th><th>Your answer</th><th>Correct</th><th>Time</th></tr>${miss}</table></div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportData()">Export all data (JSON)</button><button class="btn line" onclick="goHome()">Back to home</button></div>`;
}
function goHome(){ state.screen='home'; state.animate=true; render(); }

// ---------- Legal ----------
function showLegal(kind){
  const tos=['This is an unofficial practice tool. It is not affiliated with or endorsed by ETEC or Qiyas.','Questions come from the publicly released ETEC trial tests. Scores here do not predict your official scaled score.','Use it for practice only. The author gives no warranty of accuracy, including for transcribed content.'];
  const priv=['All answers, timings and history are stored only in this browser (local storage). Nothing is sent to a server.','The export button creates a local file that you control. Clearing history removes the stored runs.','Fonts and libraries load from public CDNs, which may see your IP address as any website would.'];
  const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><h2>${kind==='tos'?'Terms of Service':'Privacy Policy'}</h2>${(kind==='tos'?tos:priv).map(p=>`<p class="muted" style="margin:10px 0">${p}</p>`).join('')}<button class="btn line" onclick="this.closest('.modal').remove()">Close</button></div>`;
  document.body.appendChild(m);
}

render();
</script>
</body>
</html>
